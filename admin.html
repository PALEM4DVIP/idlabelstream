<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Update Live Score</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg: #0b0b14;
    --panel: #14141f;
    --border: #26263a;
    --purple: #6d5bd0;
    --text: #e6e6f0;
    --muted: #8888a0;
    --live: #ff4d5e;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  #loginBox {
    max-width: 360px;
    margin: 80px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
  }
  #loginBox input {
    width: 100%;
    padding: 10px 12px;
    margin: 14px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f0f18;
    color: var(--text);
    font-size: 14px;
  }
  button {
    background: var(--purple);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  #dashboard { display: none; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .league { font-weight: 700; font-size: 14px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.live { background: rgba(255,77,94,0.15); color: var(--live); }
  .badge.upcoming { background: rgba(109,91,208,0.2); color: #a292f5; }
  .badge.ended { background: rgba(136,136,160,0.2); color: var(--muted); }

  .row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .team { font-size: 14px; font-weight: 600; }
  .score-input {
    width: 48px;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f0f18;
    color: var(--text);
    font-weight: 700;
  }
  .score-group { display: flex; align-items: center; gap: 6px; justify-content: center; }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f0f18;
    color: var(--text);
    font-size: 13px;
  }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .status-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .status-msg.ok { color: var(--green); }
  .status-msg.err { color: var(--live); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
</style>
</head>
<body>

  <div id="loginBox">
    <h1>Admin Panel</h1>
    <p class="sub">Masukkan token admin untuk update live score</p>
    <input type="password" id="tokenInput" placeholder="Admin token" />
    <br />
    <button onclick="login()">Masuk</button>
    <p class="status-msg err" id="loginMsg"></p>
  </div>

  <div id="dashboard">
    <div class="toolbar">
      <div>
        <h1>Update Live Score</h1>
        <p class="sub">Perubahan langsung tampil di halaman utama</p>
      </div>
      <button class="secondary" onclick="logout()">Keluar</button>
    </div>
    <div id="matchList"></div>
  </div>

<script>
  const API_MATCHES = "/api/matches";
  const API_UPDATE = "/api/admin/update";

  function getToken() { return sessionStorage.getItem("admin_token"); }

  function login() {
    const val = document.getElementById("tokenInput").value.trim();
    if (!val) return;
    sessionStorage.setItem("admin_token", val);
    verifyAndLoad();
  }

  function logout() {
    sessionStorage.removeItem("admin_token");
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
  }

  async function verifyAndLoad() {
    try {
      const res = await fetch(API_MATCHES);
      const data = await res.json();
      renderMatches(data.matches || []);
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    } catch (err) {
      document.getElementById("loginMsg").textContent = "Gagal memuat data: " + err.message;
    }
  }

  function renderMatches(matches) {
    const container = document.getElementById("matchList");
    container.innerHTML = "";

    matches.forEach((m) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <span class="league">${m.league}</span>
          <span class="badge ${m.status}">${m.status}</span>
        </div>
        <div class="row">
          <span class="team">${m.home}</span>
          <div class="score-group">
            <input type="number" class="score-input" id="home-${m.id}" value="${m.homeScore ?? 0}" />
            <span>-</span>
            <input type="number" class="score-input" id="away-${m.id}" value="${m.awayScore ?? 0}" />
          </div>
          <span class="team" style="text-align:right">${m.away}</span>
        </div>
        <div class="fields">
          <div class="field">
            <label>Status</label>
            <select id="status-${m.id}">
              <option value="upcoming" ${m.status === "upcoming" ? "selected" : ""}>Upcoming</option>
              <option value="live" ${m.status === "live" ? "selected" : ""}>Live</option>
              <option value="ended" ${m.status === "ended" ? "selected" : ""}>Ended</option>
            </select>
          </div>
          <div class="field">
            <label>Skor HT</label>
            <input type="text" id="ht-${m.id}" value="${m.htScore || "-"}" />
          </div>
          <div class="field">
            <label>Corner Home</label>
            <input type="number" id="cornerHome-${m.id}" value="${m.cornerHome || 0}" />
          </div>
          <div class="field">
            <label>Corner Away</label>
            <input type="number" id="cornerAway-${m.id}" value="${m.cornerAway || 0}" />
          </div>
        </div>
        <div class="actions">
          <button onclick="saveMatch('${m.id}')">Simpan</button>
        </div>
        <p class="status-msg" id="msg-${m.id}"></p>
      `;
      container.appendChild(card);
    });
  }

  async function saveMatch(id) {
    const msgEl = document.getElementById(`msg-${id}`);
    msgEl.textContent = "Menyimpan...";
    msgEl.className = "status-msg";

    const payload = {
      id,
      homeScore: Number(document.getElementById(`home-${id}`).value),
      awayScore: Number(document.getElementById(`away-${id}`).value),
      status: document.getElementById(`status-${id}`).value,
      htScore: document.getElementById(`ht-${id}`).value,
      cornerHome: Number(document.getElementById(`cornerHome-${id}`).value),
      cornerAway: Number(document.getElementById(`cornerAway-${id}`).value)
    };

    try {
      const res = await fetch(API_UPDATE, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-token": getToken()
        },
        body: JSON.stringify(payload)
      });

      if (res.status === 401) {
        msgEl.textContent = "Token salah — silakan login ulang.";
        msgEl.className = "status-msg err";
        logout();
        return;
      }

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || "Gagal menyimpan");
      }

      msgEl.textContent = "Tersimpan ✓";
      msgEl.className = "status-msg ok";
    } catch (err) {
      msgEl.textContent = "Error: " + err.message;
      msgEl.className = "status-msg err";
    }
  }

  // Auto-login kalau token sudah tersimpan di session
  if (getToken()) verifyAndLoad();
</script>
</body>
</html>
